services:
  - type: web
    name: social-media-ai-agent
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: social-media-ai-agent-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false

databases:
  - name: social-media-ai-agent-db
    plan: free
    databaseName: social_media_agent
